# FrankBoard marketing site — frankboard.com
# Static site only. App runs at app.frankboard.com (separate config).
# Cloudflare proxies here; origin must serve HTTPS (Full / Full Strict).

# HTTP → HTTPS (apex)
server {
    listen 80;
    listen [::]:80;
    server_name frankboard.com www.frankboard.com;
    return 301 https://frankboard.com$request_uri;
}

# www → apex on HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.frankboard.com;

    ssl_certificate     /etc/letsencrypt/live/frankboard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frankboard.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://frankboard.com$request_uri;
}

# Main site (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name frankboard.com;

    ssl_certificate     /etc/letsencrypt/live/frankboard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frankboard.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/frankboard-site;
    index index.html;

    # Sitemap — explicit handling for reliable serving
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Allow .well-known (ACME, security.txt) — must be before the deny rule
    location ^~ /.well-known/ {
        allow all;
    }

    # Cache static assets
    location ~* \.(css|js|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }
}
