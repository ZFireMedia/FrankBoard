# FrankBoard marketing site — frankboard.com
# Static site only. App runs at app.frankboard.com (separate config).

# Redirect www to non-www (canonical: frankboard.com)
server {
    listen 80;
    listen [::]:80;
    server_name www.frankboard.com;
    return 301 https://frankboard.com$request_uri;
}

# Main site
server {
    listen 80;
    listen [::]:80;
    server_name frankboard.com;

    root /var/www/frankboard-site;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Allow .well-known (ACME, security.txt) — must be before the deny rule
    location ^~ /.well-known/ {
        allow all;
    }

    # Cache static assets
    location ~* \.(css|js|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }
}
