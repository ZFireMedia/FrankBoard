# FrankBoard app — app.frankboard.com
# Proxies to Docker app on port 8080. Separate from marketing site.
# Enable when ready: ln -s /etc/nginx/sites-available/app.frankboard.com.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name app.frankboard.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
