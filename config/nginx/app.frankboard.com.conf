# FrankBoard app — app.frankboard.com
# Proxies to Docker app on port 8080. Separate from marketing site.
# Installed by scripts/deploy-site.sh.
# Exact server_name on 443 must beat wildcard.frankboard.com.conf (*.frankboard.com → :5000).

server {
    listen 80;
    listen [::]:80;
    server_name app.frankboard.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.frankboard.com;

    ssl_certificate     /etc/letsencrypt/live/app.frankboard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.frankboard.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
